openapi: 3.0.3
info:
  title: Hospitality Management Operating System (HMOS) API
  version: 1.0.0
  description: Enterprise PMS, Front Office, Corporate Governance, F&B/KOT, and Operations
    REST API
paths:
  /api/v1/auth/login/:
    post:
      operationId: v1_auth_login_create
      description: |-
        Takes a set of user credentials and returns an access and refresh JSON web
        token pair to prove the authentication of those credentials.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomTokenObtainPairRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CustomTokenObtainPairRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CustomTokenObtainPairRequest'
        required: true
      responses:
        '200':
          description: No response body
  /api/v1/auth/me/:
    get:
      operationId: v1_auth_me_retrieve
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/v1/auth/refresh/:
    post:
      operationId: v1_auth_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/v1/auth/users/:
    get:
      operationId: v1_auth_users_list
      parameters:
      - in: query
        name: is_active
        schema:
          type: boolean
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - in: query
        name: organization
        schema:
          type: string
          format: uuid
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: role
        schema:
          type: string
          enum:
          - ACCOUNTANT
          - CEO
          - CHEF_KITCHEN
          - DRIVER
          - FRONT_DESK
          - GUEST
          - HOUSEKEEPING
          - HR
          - MAINTENANCE
          - OPERATIONS_DIRECTOR
          - ORG_ADMIN
          - PRESIDENT
          - PROPERTY_MANAGER
          - RESTAURANT_POS
          - SECURITY_STAFF
          - SHAREHOLDER
          - SUPER_ADMIN
          - TRANSPORT_DISPATCHER
          - TRANSPORT_VENDOR
          - VICE_PRESIDENT
        description: |-
          * `SUPER_ADMIN` - Super Admin
          * `ORG_ADMIN` - Organization Admin
          * `PRESIDENT` - President
          * `VICE_PRESIDENT` - Vice President
          * `CEO` - CEO
          * `OPERATIONS_DIRECTOR` - Operations Director
          * `SHAREHOLDER` - Shareholder
          * `PROPERTY_MANAGER` - Property Manager
          * `FRONT_DESK` - Front Desk
          * `HOUSEKEEPING` - Housekeeping
          * `RESTAURANT_POS` - Restaurant / POS
          * `CHEF_KITCHEN` - Chef / Kitchen
          * `MAINTENANCE` - Maintenance
          * `ACCOUNTANT` - Accountant
          * `HR` - HR Staff
          * `SECURITY_STAFF` - Security / Gate Staff
          * `TRANSPORT_DISPATCHER` - Transport Dispatcher
          * `DRIVER` - Driver
          * `TRANSPORT_VENDOR` - Transport Vendor
          * `GUEST` - Guest
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedUserList'
          description: ''
    post:
      operationId: v1_auth_users_create
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/v1/auth/users/{id}/:
