components:
  schemas:
    AvailabilitySearchResponse:
      type: object
      properties:
        success:
          type: boolean
          default: true
        property_id:
          type: string
          format: uuid
        check_in:
          type: string
          format: date
        check_out:
          type: string
          format: date
        total_nights:
          type: integer
        available_room_types:
          type: array
          items:
            $ref: '#/components/schemas/AvailableRoomType'
      required:
      - available_room_types
      - check_in
      - check_out
      - property_id
      - total_nights
    AvailableRoomType:
      type: object
      properties:
        room_type_id:
          type: string
          format: uuid
        name:
          type: string
        code:
          type: string
        base_occupancy:
          type: integer
        max_occupancy:
          type: integer
        nightly_rate:
          type: number
          format: double
        total_nights:
          type: integer
        estimated_total:
          type: number
          format: double
      required:
      - base_occupancy
      - code
      - estimated_total
      - max_occupancy
      - name
      - nightly_rate
      - room_type_id
      - total_nights
    Building:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        floors:
          type: array
          items:
            $ref: '#/components/schemas/Floor'
          readOnly: true
        name:
          type: string
          maxLength: 128
        code:
          type: string
          maxLength: 32
          pattern: ^[-a-zA-Z0-9_]+$
        property:
          type: string
          format: uuid
      required:
      - code
      - floors
      - id
      - name
      - property
    BuildingRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        code:
          type: string
          minLength: 1
          maxLength: 32
          pattern: ^[-a-zA-Z0-9_]+$
        property:
          type: string
          format: uuid
      required:
      - code
      - name
      - property
    ChargeEvent:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        is_active:
          type: boolean
        event_id:
          type: string
          readOnly: true
        idempotency_key:
          type: string
          maxLength: 128
        source:
          $ref: '#/components/schemas/ChargeEventSourceEnum'
        outlet_code:
          type: string
          maxLength: 64
        description:
          type: string
          maxLength: 255
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        tax_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        total_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
        status:
          $ref: '#/components/schemas/ChargeEventStatusEnum'
        organization:
          type: string
          format: uuid
          description: The tenant/organization that owns this record.
        property:
          type: string
          format: uuid
        folio:
          type: string
          format: uuid
        reservation:
          type: string
          format: uuid
          nullable: true
        room:
          type: string
          format: uuid
          nullable: true
        guest:
          type: string
          format: uuid
        posted_by:
          type: string
          format: uuid
          nullable: true
      required:
      - amount
      - created_at
      - description
      - event_id
      - folio
      - guest
      - id
      - idempotency_key
      - organization
      - property
      - total_amount
      - updated_at
    ChargeEventRequest:
      type: object
      properties:
        is_active:
          type: boolean
        idempotency_key:
          type: string
          minLength: 1
          maxLength: 128
        source:
          $ref: '#/components/schemas/ChargeEventSourceEnum'
        outlet_code:
          type: string
          maxLength: 64
        description:
          type: string
          minLength: 1
          maxLength: 255
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        tax_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        status:
          $ref: '#/components/schemas/ChargeEventStatusEnum'
        organization:
          type: string
          format: uuid
          description: The tenant/organization that owns this record.
        property:
          type: string
          format: uuid
        folio:
          type: string
          format: uuid
        reservation:
          type: string
          format: uuid
          nullable: true
        room:
          type: string
          format: uuid
          nullable: true
        guest:
          type: string
          format: uuid
        posted_by:
          type: string
          format: uuid
          nullable: true
      required:
      - amount
      - description
      - folio
      - guest
      - idempotency_key
      - organization
      - property
    ChargeEventSourceEnum:
      enum:
      - ROOM_RATE
      - POS_RESTAURANT
      - ROOM_SERVICE
      - SPA
      - ACTIVITIES
      - LAUNDRY
      - MINIBAR
      - BANQUET
      - DAMAGE
      - OTHER
      type: string
      description: |-
        * `ROOM_RATE` - Room Rate Charge
        * `POS_RESTAURANT` - Restaurant / Bar POS
        * `ROOM_SERVICE` - Room Service
        * `SPA` - Spa Treatment
        * `ACTIVITIES` - Activities / Tours
        * `LAUNDRY` - Laundry Service
        * `MINIBAR` - Minibar Consumption
        * `BANQUET` - Banquet / Event
        * `DAMAGE` - Damage Penalty
        * `OTHER` - Other Amenity
    ChargeEventStatusEnum:
      enum:
      - POSTED
      - ADJUSTED
      - VOIDED
      - REVERSED
      type: string
      description: |-
        * `POSTED` - Posted
        * `ADJUSTED` - Adjusted
        * `VOIDED` - Voided
        * `REVERSED` - Reversed
    CustomTokenObtainPairRequest:
      type: object
      properties:
        email:
          type: string
          writeOnly: true
          minLength: 1
        password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - email
      - password
    ExecutiveAssignment:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        user_name:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
