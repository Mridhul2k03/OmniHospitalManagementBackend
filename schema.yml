          type: integer
          default: 1
        description: Number of adult guests
      - in: query
        name: check_in
        schema:
          type: string
        description: Check-in date YYYY-MM-DD
        required: true
      - in: query
        name: check_out
        schema:
          type: string
        description: Check-out date YYYY-MM-DD
        required: true
      - in: query
        name: property_id
        schema:
          type: string
        description: Target property UUID
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvailabilitySearchResponse'
          description: ''
  /api/v1/billing/charge-events/:
    get:
