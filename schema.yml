      parameters:
      - in: query
        name: folio
        schema:
          type: string
          format: uuid
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: property
        schema:
          type: string
          format: uuid
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: source
        schema:
          type: string
          enum:
          - ACTIVITIES
          - BANQUET
          - DAMAGE
          - LAUNDRY
          - MINIBAR
          - OTHER
          - POS_RESTAURANT
          - ROOM_RATE
          - ROOM_SERVICE
          - SPA
        description: |-
          * `ROOM_RATE` - Room Rate Charge
          * `POS_RESTAURANT` - Restaurant / Bar POS
          * `ROOM_SERVICE` - Room Service
          * `SPA` - Spa Treatment
          * `ACTIVITIES` - Activities / Tours
          * `LAUNDRY` - Laundry Service
          * `MINIBAR` - Minibar Consumption
          * `BANQUET` - Banquet / Event
          * `DAMAGE` - Damage Penalty
          * `OTHER` - Other Amenity
      - in: query
        name: status
        schema:
          type: string
          enum:
          - ADJUSTED
          - POSTED
          - REVERSED
          - VOIDED
        description: |-
          * `POSTED` - Posted
          * `ADJUSTED` - Adjusted
          * `VOIDED` - Voided
          * `REVERSED` - Reversed
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedChargeEventList'
          description: ''
